name: CodeSkill LockDown Release

on:
  push:
    tags:
      - 'lockdown-v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows-latest
          - macos-latest
          - ubuntu-22.04
      force_rebuild:
        description: 'Force rebuild even if asset already exists in release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if release asset already exists or platform is filtered
        id: check_asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHOSEN_PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          if [ "$CHOSEN_PLATFORM" != "all" ] && [ "$CHOSEN_PLATFORM" != "${{ matrix.platform }}" ]; then
            echo "Skipping build for ${{ matrix.platform }} (workflow_dispatch selected $CHOSEN_PLATFORM)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FORCE_REBUILD="${{ github.event.inputs.force_rebuild || 'false' }}"
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "force_rebuild is true, proceeding with build"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(node -p "require('./codeskill-lockdown/src-tauri/tauri.conf.json').version" 2>/dev/null || echo "1.0.0")
          REF_NAME="${GITHUB_REF_NAME:-lockdown-v${VERSION}}"
          TAG_NAME="${REF_NAME}"

          if command -v gh >/dev/null 2>&1; then
            ASSETS=$(gh release view "$TAG_NAME" --json assets -q ".assets[].name" 2>/dev/null || true)
            if [ -n "$ASSETS" ]; then
              PLATFORM="${{ matrix.platform }}"
              FOUND=false
              if [ "$PLATFORM" = "macos-latest" ] && echo "$ASSETS" | grep -q '\.dmg$'; then
                FOUND=true
              elif [ "$PLATFORM" = "ubuntu-22.04" ] && echo "$ASSETS" | grep -q '\.deb$'; then
                FOUND=true
              elif [ "$PLATFORM" = "windows-latest" ] && echo "$ASSETS" | grep -q 'CodeSkill-LockDown-Setup\.exe'; then
                FOUND=true
              fi

              if [ "$FOUND" = "true" ]; then
                echo "Asset for $PLATFORM already exists in release $TAG_NAME. Skipping redundant build."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.check_asset.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        if: steps.check_asset.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install Rust Cache
        if: steps.check_asset.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: codeskill-lockdown/src-tauri -> target

      - name: Install Linux system dependencies
        if: steps.check_asset.outputs.skip != 'true' && matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libx11-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install LockDown Node dependencies
        if: steps.check_asset.outputs.skip != 'true'
        run: npm install
        working-directory: codeskill-lockdown

      - name: Build CodeSkill LockDown Desktop Application
        if: steps.check_asset.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN || 'https://codeskill.com' }}
        with:
          projectPath: codeskill-lockdown
          args: ${{ matrix.platform == 'windows-latest' && '--bundles nsis' || '' }}
          tagName: lockdown-v__VERSION__
          releaseName: 'CodeSkill LockDown v__VERSION__'
          releaseBody: 'Official secure examination browser release for CodeSkill assessments.'
          releaseDraft: false
          prerelease: false

      - name: Standardize and Upload Windows NSIS Installer Asset
        if: steps.check_asset.outputs.skip != 'true' && matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-nsis
          NSIS_FILE=""
          for f in codeskill-lockdown/src-tauri/target/release/bundle/nsis/*.exe codeskill-lockdown/src-tauri/target/release/*.exe; do
            if [ -f "$f" ] && [[ ! "$f" =~ uninst ]]; then
              NSIS_FILE="$f"
              break
            fi
          done

          if [ -n "$NSIS_FILE" ] && [ -f "$NSIS_FILE" ]; then
            echo "Found NSIS installer: $NSIS_FILE"
            VERSION=$(node -p "require('./codeskill-lockdown/src-tauri/tauri.conf.json').version")
            REF_NAME="${GITHUB_REF_NAME:-lockdown-v${VERSION}}"
            TAG_NAME="${REF_NAME}"
            cp "$NSIS_FILE" dist-nsis/CodeSkill-LockDown-Setup.exe
            cp "$NSIS_FILE" dist-nsis/codeskill-lockdown-setup.exe
            cp "$NSIS_FILE" "dist-nsis/CodeSkill-LockDown-${VERSION}-Setup.exe"
            echo "Publishing standardized assets to $TAG_NAME"
            if command -v gh >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" dist-nsis/CodeSkill-LockDown-Setup.exe dist-nsis/codeskill-lockdown-setup.exe "dist-nsis/CodeSkill-LockDown-${VERSION}-Setup.exe" --clobber || echo "Notice: gh release upload skipped or release not created yet"
            fi
          else
            echo "Notice: No NSIS installer binary found to standardize."
          fi
