name: CodeSkill LockDown Release

on:
  push:
    paths:
      - 'codeskill-lockdown/**'
      - '.github/workflows/lockdown-release.yml'
    tags:
      - 'lockdown-v*'
  pull_request:
    paths:
      - 'codeskill-lockdown/**'
      - '.github/workflows/lockdown-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: codeskill-lockdown/src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libx11-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install LockDown Node dependencies
        run: npm install
        working-directory: codeskill-lockdown

      - name: Build CodeSkill LockDown Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN || 'https://codeskill.com' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: codeskill-lockdown
          args: ${{ matrix.platform == 'windows-latest' && '--bundles nsis' || '' }}
          tagName: lockdown-v__VERSION__
          releaseName: 'CodeSkill LockDown v__VERSION__'
          releaseBody: 'Official secure examination browser release for CodeSkill assessments.'
          releaseDraft: false
          prerelease: false

      - name: Standardize and Upload Windows NSIS Installer Asset
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-nsis
          NSIS_FILE=""
          for f in codeskill-lockdown/src-tauri/target/release/bundle/nsis/*.exe codeskill-lockdown/src-tauri/target/release/*.exe; do
            if [ -f "$f" ] && [[ ! "$f" =~ uninst ]]; then
              NSIS_FILE="$f"
              break
            fi
          done

          if [ -n "$NSIS_FILE" ] && [ -f "$NSIS_FILE" ]; then
            echo "Found NSIS installer: $NSIS_FILE"
            VERSION=$(node -p "require('./codeskill-lockdown/src-tauri/tauri.conf.json').version")
            REF_NAME="${GITHUB_REF_NAME:-lockdown-v${VERSION}}"
            TAG_NAME="${REF_NAME}"
            cp "$NSIS_FILE" dist-nsis/CodeSkill-LockDown-Setup.exe
            cp "$NSIS_FILE" dist-nsis/codeskill-lockdown-setup.exe
            cp "$NSIS_FILE" "dist-nsis/CodeSkill-LockDown-${VERSION}-Setup.exe"
            echo "Publishing standardized Windows assets to $TAG_NAME"
            if command -v gh >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" dist-nsis/CodeSkill-LockDown-Setup.exe dist-nsis/codeskill-lockdown-setup.exe "dist-nsis/CodeSkill-LockDown-${VERSION}-Setup.exe" --clobber || echo "Notice: gh release upload skipped or release not created yet"
            fi
          else
            echo "Notice: No NSIS installer binary found to standardize."
          fi

      - name: Standardize and Upload macOS DMG Asset
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-dmg
          DMG_FILE=""
          for f in codeskill-lockdown/src-tauri/target/release/bundle/dmg/*.dmg codeskill-lockdown/src-tauri/target/*/release/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              DMG_FILE="$f"
              break
            fi
          done

          if [ -n "$DMG_FILE" ] && [ -f "$DMG_FILE" ]; then
            echo "Found macOS DMG installer: $DMG_FILE"
            VERSION=$(node -p "require('./codeskill-lockdown/src-tauri/tauri.conf.json').version")
            REF_NAME="${GITHUB_REF_NAME:-lockdown-v${VERSION}}"
            TAG_NAME="${REF_NAME}"
            cp "$DMG_FILE" dist-dmg/codeskill-lockdown.dmg
            cp "$DMG_FILE" dist-dmg/CodeSkill-LockDown.dmg
            cp "$DMG_FILE" "dist-dmg/CodeSkill-LockDown-${VERSION}.dmg"
            echo "Publishing standardized macOS assets to $TAG_NAME"
            if command -v gh >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" dist-dmg/codeskill-lockdown.dmg dist-dmg/CodeSkill-LockDown.dmg "dist-dmg/CodeSkill-LockDown-${VERSION}.dmg" --clobber || echo "Notice: gh release upload skipped or release not created yet"
            fi
          else
            echo "Notice: No macOS DMG installer binary found to standardize."
          fi

      - name: Standardize and Upload Linux Package Assets
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-linux
          DEB_FILE=""
          APPIMAGE_FILE=""
          for f in codeskill-lockdown/src-tauri/target/release/bundle/deb/*.deb; do
            if [ -f "$f" ]; then
              DEB_FILE="$f"
              break
            fi
          done
          for f in codeskill-lockdown/src-tauri/target/release/bundle/appimage/*.AppImage; do
            if [ -f "$f" ]; then
              APPIMAGE_FILE="$f"
              break
            fi
          done

          VERSION=$(node -p "require('./codeskill-lockdown/src-tauri/tauri.conf.json').version")
          REF_NAME="${GITHUB_REF_NAME:-lockdown-v${VERSION}}"
          TAG_NAME="${REF_NAME}"

          UPLOAD_FILES=()
          if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
            echo "Found Linux DEB package: $DEB_FILE"
            cp "$DEB_FILE" dist-linux/codeskill-lockdown.deb
            cp "$DEB_FILE" dist-linux/CodeSkill-LockDown.deb
            cp "$DEB_FILE" "dist-linux/CodeSkill-LockDown-${VERSION}.deb"
            UPLOAD_FILES+=(dist-linux/codeskill-lockdown.deb dist-linux/CodeSkill-LockDown.deb "dist-linux/CodeSkill-LockDown-${VERSION}.deb")
          fi

          if [ -n "$APPIMAGE_FILE" ] && [ -f "$APPIMAGE_FILE" ]; then
            echo "Found Linux AppImage package: $APPIMAGE_FILE"
            cp "$APPIMAGE_FILE" dist-linux/codeskill-lockdown.AppImage
            cp "$APPIMAGE_FILE" dist-linux/CodeSkill-LockDown.AppImage
            cp "$APPIMAGE_FILE" "dist-linux/CodeSkill-LockDown-${VERSION}.AppImage"
            UPLOAD_FILES+=(dist-linux/codeskill-lockdown.AppImage dist-linux/CodeSkill-LockDown.AppImage "dist-linux/CodeSkill-LockDown-${VERSION}.AppImage")
          fi

          if [ ${#UPLOAD_FILES[@]} -gt 0 ]; then
            echo "Publishing standardized Linux assets to $TAG_NAME: ${UPLOAD_FILES[*]}"
            if command -v gh >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" "${UPLOAD_FILES[@]}" --clobber || echo "Notice: gh release upload skipped or release not created yet"
            fi
          else
            echo "Notice: No Linux installer binaries found to standardize."
          fi
