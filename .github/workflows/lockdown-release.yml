name: CodeSkill LockDown Release

on:
  push:
    branches:
      - main
    paths:
      - 'codeskill-lockdown-macos/**'
      - 'codeskill-lockdown-windows/**'
      - 'codeskill-lockdown-linux/**'
      - '.github/workflows/lockdown-release.yml'
    tags:
      - 'lockdown-v*'
  pull_request:
    paths:
      - 'codeskill-lockdown-macos/**'
      - 'codeskill-lockdown-windows/**'
      - 'codeskill-lockdown-linux/**'
      - '.github/workflows/lockdown-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.set.outputs.macos }}
      windows: ${{ steps.set.outputs.windows }}
      linux: ${{ steps.set.outputs.linux }}
      tag_name: ${{ steps.set.outputs.tag_name }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        with:
          filters: |
            macos:
              - 'codeskill-lockdown-macos/**'
              - '.github/workflows/lockdown-release.yml'
            windows:
              - 'codeskill-lockdown-windows/**'
              - '.github/workflows/lockdown-release.yml'
            linux:
              - 'codeskill-lockdown-linux/**'
              - '.github/workflows/lockdown-release.yml'
      - id: set
        run: |
          VERSION=$(node -p "require('./codeskill-lockdown-macos/src-tauri/tauri.conf.json').version")
          TAG_NAME="${GITHUB_REF_NAME:-lockdown-v${VERSION}}"
          if [[ "$TAG_NAME" != lockdown-v* ]]; then TAG_NAME="lockdown-v${VERSION}"; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "linux=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=${{ steps.filter.outputs.macos }}" >> "$GITHUB_OUTPUT"
            echo "windows=${{ steps.filter.outputs.windows }}" >> "$GITHUB_OUTPUT"
            echo "linux=${{ steps.filter.outputs.linux }}" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: detect-changes
    if: needs.detect-changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: codeskill-lockdown-windows/src-tauri -> target
      - name: Install LockDown Node dependencies
        run: npm install
        working-directory: codeskill-lockdown-windows
      - name: Build CodeSkill LockDown (Windows)
        working-directory: codeskill-lockdown-windows
        env:
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN || 'https://codeskill.com' }}
        run: npx --no-install tauri build --bundles nsis
      - name: Package Standardized Windows Assets
        shell: bash
        run: |
          mkdir -p dist-nsis
          NSIS_FILE=""
          for f in codeskill-lockdown-windows/src-tauri/target/release/bundle/nsis/*.exe codeskill-lockdown-windows/src-tauri/target/release/*.exe; do
            if [ -f "$f" ] && [[ ! "$f" =~ uninst ]]; then
              NSIS_FILE="$f"
              break
            fi
          done
          if [ -n "$NSIS_FILE" ] && [ -f "$NSIS_FILE" ]; then
            VERSION="${{ needs.detect-changes.outputs.version }}"
            cp "$NSIS_FILE" dist-nsis/CodeSkill-LockDown-Setup.exe
            cp "$NSIS_FILE" "dist-nsis/CodeSkill-LockDown-${VERSION}-Setup.exe"
            sha256sum dist-nsis/*.exe > dist-nsis/SHA256SUMS-windows.txt
            EXE_HASH=$(sha256sum dist-nsis/CodeSkill-LockDown-Setup.exe | awk '{print $1}')
            node -e "const fs=require('fs');fs.writeFileSync('dist-nsis/release-manifest-windows.json',JSON.stringify({platform:'windows',version:'$VERSION',filename:'CodeSkill-LockDown-Setup.exe',sha256:'$EXE_HASH',generatedAt:new Date().toISOString()},null,2));"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lockdown-windows-assets
          path: dist-nsis/
          if-no-files-found: error

  build-macos:
    needs: detect-changes
    if: needs.detect-changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: codeskill-lockdown-macos/src-tauri -> target
      - name: Install LockDown Node dependencies
        run: npm install
        working-directory: codeskill-lockdown-macos
      - name: Build CodeSkill LockDown (macOS)
        working-directory: codeskill-lockdown-macos
        env:
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN || 'https://codeskill.com' }}
        run: npx --no-install tauri build
      - name: Package Standardized macOS Assets
        shell: bash
        run: |
          mkdir -p dist-dmg
          DMG_FILE=""
          for f in codeskill-lockdown-macos/src-tauri/target/release/bundle/dmg/*.dmg codeskill-lockdown-macos/src-tauri/target/*/release/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              DMG_FILE="$f"
              break
            fi
          done
          if [ -n "$DMG_FILE" ] && [ -f "$DMG_FILE" ]; then
            VERSION="${{ needs.detect-changes.outputs.version }}"
            cp "$DMG_FILE" dist-dmg/codeskill-lockdown.dmg
            cp "$DMG_FILE" "dist-dmg/CodeSkill-LockDown-${VERSION}.dmg"
            shasum -a 256 dist-dmg/*.dmg > dist-dmg/SHA256SUMS-macos.txt
            DMG_HASH=$(shasum -a 256 dist-dmg/codeskill-lockdown.dmg | awk '{print $1}')
            node -e "const fs=require('fs');fs.writeFileSync('dist-dmg/release-manifest-macos.json',JSON.stringify({platform:'macos',version:'$VERSION',filename:'codeskill-lockdown.dmg',sha256:'$DMG_HASH',generatedAt:new Date().toISOString()},null,2));"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lockdown-macos-assets
          path: dist-dmg/
          if-no-files-found: error

  build-linux:
    needs: detect-changes
    if: needs.detect-changes.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: codeskill-lockdown-linux/src-tauri -> target
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libx11-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install LockDown Node dependencies
        run: npm install
        working-directory: codeskill-lockdown-linux
      - name: Build CodeSkill LockDown (Linux)
        working-directory: codeskill-lockdown-linux
        env:
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN || 'https://codeskill.com' }}
        run: npx --no-install tauri build
      - name: Package Standardized Linux Assets
        shell: bash
        run: |
          mkdir -p dist-linux
          DEB_FILE=""
          APPIMAGE_FILE=""
          for f in codeskill-lockdown-linux/src-tauri/target/release/bundle/deb/*.deb; do
            if [ -f "$f" ]; then
              DEB_FILE="$f"
              break
            fi
          done
          for f in codeskill-lockdown-linux/src-tauri/target/release/bundle/appimage/*.AppImage; do
            if [ -f "$f" ]; then
              APPIMAGE_FILE="$f"
              break
            fi
          done
          VERSION="${{ needs.detect-changes.outputs.version }}"
          UPLOAD_FILES=()
          if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
            cp "$DEB_FILE" dist-linux/codeskill-lockdown.deb
            cp "$DEB_FILE" "dist-linux/CodeSkill-LockDown-${VERSION}.deb"
            UPLOAD_FILES+=(dist-linux/codeskill-lockdown.deb "dist-linux/CodeSkill-LockDown-${VERSION}.deb")
          fi
          if [ -n "$APPIMAGE_FILE" ] && [ -f "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" dist-linux/codeskill-lockdown.AppImage
            cp "$APPIMAGE_FILE" "dist-linux/CodeSkill-LockDown-${VERSION}.AppImage"
            UPLOAD_FILES+=(dist-linux/codeskill-lockdown.AppImage "dist-linux/CodeSkill-LockDown-${VERSION}.AppImage")
          fi
          if [ ${#UPLOAD_FILES[@]} -gt 0 ]; then
            sha256sum "${UPLOAD_FILES[@]}" > dist-linux/SHA256SUMS-linux.txt
            node -e "const fs=require('fs');fs.writeFileSync('dist-linux/release-manifest-linux.json',JSON.stringify({platform:'linux',version:'$VERSION',files:'${UPLOAD_FILES[*]}'.split(' '),generatedAt:new Date().toISOString()},null,2));"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lockdown-linux-assets
          path: dist-linux/
          if-no-files-found: error

  publish-release:
    needs: [detect-changes, build-windows, build-macos, build-linux]
    if: >
      always() &&
      github.event_name != 'pull_request' &&
      !cancelled() &&
      (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Platform Assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME="${{ needs.detect-changes.outputs.tag_name }}"
          VERSION="${{ needs.detect-changes.outputs.version }}"

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --target "${{ github.sha }}" \
              --title "CodeSkill LockDown v${VERSION}" \
              --notes "Official secure examination browser release for CodeSkill assessments."
            sleep 3
          fi

          EXISTING_ASSETS=$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name' 2>/dev/null || true)

          for f in release-assets/*; do
            [ -f "$f" ] || continue
            BASENAME=$(basename "$f")
            LOWER_BASE=$(echo "$BASENAME" | tr '[:upper:]' '[:lower:]')

            # Delete any existing asset matching case-insensitively with different casing
            while IFS= read -r existing; do
              [ -n "$existing" ] || continue
              LOWER_EXISTING=$(echo "$existing" | tr '[:upper:]' '[:lower:]')
              if [ "$LOWER_EXISTING" = "$LOWER_BASE" ] && [ "$existing" != "$BASENAME" ]; then
                echo "Removing case-conflicting asset: $existing"
                gh release delete-asset "$TAG_NAME" "$existing" -y || true
              fi
            done <<< "$EXISTING_ASSETS"

            echo "Uploading $BASENAME..."
            gh release upload "$TAG_NAME" "$f" --clobber
          done
