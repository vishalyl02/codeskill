name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend-nestjs/package-lock.json

      - name: Install dependencies
        working-directory: backend-nestjs
        run: npm ci --legacy-peer-deps

      - name: Build backend
        working-directory: backend-nestjs
        run: npm run build

      - name: Test backend
        working-directory: backend-nestjs
        run: npm test -- --maxWorkers=2

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        working-directory: frontend-v2
        run: npm ci --legacy-peer-deps

      - name: Test frontend
        working-directory: frontend-v2
        run: npm test -- --maxWorkers=2

      - name: Build frontend
        working-directory: frontend-v2
        run: npm run build
