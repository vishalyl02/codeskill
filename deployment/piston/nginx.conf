# Install on the dedicated execution host. SG/firewall permits only trusted
# API/worker security groups. For cross-VPC transport use mTLS; do not use public HTTP.
server {
    listen 2000;
    server_tokens off;
    client_max_body_size 2m;
    access_log off;
    location = /api/v2/runtimes {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:2001;
        proxy_read_timeout 15s;
    }
    location = /api/v2/execute {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:2001;
        proxy_read_timeout 15s;
        proxy_connect_timeout 2s;
    }
    # Management and interactive endpoints are unreachable from the backend.
    location / { return 404; }
}
