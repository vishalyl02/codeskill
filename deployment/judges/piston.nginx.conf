events { worker_connections 512; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream judges {
    zone judges 64k;
    least_conn;
    server piston:2000 resolve;
    keepalive 16;
  }
  server {
    listen 2000;
    client_max_body_size 2m;
    # Package management is only reachable from the VM during provisioning.
    location /api/v2/packages { return 403; }
    location /api/v2/ {
      proxy_pass http://judges;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 180s;
      # Never replay an accepted execution POST against a different replica.
      proxy_next_upstream off;
    }
  }
}
