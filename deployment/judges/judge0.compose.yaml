# Dedicated Linux execution host only; Judge0 1.13.1 requires cgroup v1.
x-judge: &judge
  image: ${JUDGE0_IMAGE:?Run scripts/judges/configure.mjs first}
  privileged: true
  cgroup: host
  restart: unless-stopped
  volumes:
    - ${JUDGE_CONFIG_DIR:?}/${JUDGE0_CONTAINER_CONFIG:-judge0.container.conf}:/judge0.conf:ro
  networks: [sandbox]
  depends_on:
    judge0-db: { condition: service_healthy }
    judge0-redis: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: '10m', max-file: '3' }
services:
  judge0-api:
    <<: *judge
    mem_limit: ${JUDGE0_API_MEMORY:-768m}
    cpus: ${JUDGE0_API_CPUS:-1}
  judge0-worker:
    <<: *judge
    command: ['bash', '/codeskill-worker.sh']
    volumes:
      - ${JUDGE_CONFIG_DIR:?}/${JUDGE0_CONTAINER_CONFIG:-judge0.container.conf}:/judge0.conf:ro
      - ${JUDGE_CONFIG_DIR}/${JUDGE0_WORKER_SCRIPT:-worker.sh}:/codeskill-worker.sh:ro
      - ${JUDGE_CONFIG_DIR}/${JUDGE0_TSC_SCRIPT:-tsc.sh}:/codeskill-tsc.sh:ro
      - ${JUDGE_CONFIG_DIR}/node-types-12.12.25:/usr/share/codeskill-node-types:ro
    mem_limit: ${JUDGE0_WORKER_MEMORY:-768m}
    cpus: ${JUDGE0_WORKER_CPUS:-1}
    stop_signal: SIGQUIT
    stop_grace_period: 145s
  judge0-db:
    image: postgres:16.2
    env_file: ${JUDGE_CONFIG_DIR}/judge0.conf
    networks: [sandbox]
    volumes: ['judge0-data:/var/lib/postgresql/data']
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U judge0 -d judge0']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
  judge0-redis:
    image: redis:7.2.4
    env_file: ${JUDGE_CONFIG_DIR}/judge0.conf
    command: ['sh', '-c', 'exec redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"']
    networks: [sandbox]
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
  judge0-gateway:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:${JUDGE0_PORT:-2358}:2358']
    volumes: ['${JUDGE_CONFIG_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro']
    networks: [sandbox, ingress]
    restart: unless-stopped
    depends_on: [judge0-api]
    mem_limit: 64m
    logging: *logging
networks:
  sandbox: { internal: true }
  ingress: {}
volumes:
  judge0-data:
