[package]
name = "codeskill-lockdown"
version = "1.0.0"
description = "CodeSkill LockDown secure desktop examination browser"
authors = ["CodeSkill Security Team"]
edition = "2021"

[lib]
name = "codeskill_lockdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.31"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "std"] }
rand_core = { version = "0.6", features = ["getrandom", "std"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4"] }
url = "2.5"
aes-gcm = "0.10"
hmac = "0.12"
libc = "0.2"
tokio = { version = "1", features = ["fs", "sync", "time", "rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt", "std"] }
tracing-appender = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_DataExchange",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder", "NSWindow", "NSRunningApplication", "NSWorkspace", "NSEvent", "block2", "libc"] }
block2 = "0.5"
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
